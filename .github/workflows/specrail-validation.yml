name: SpecRail validation

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Install Pi smoke-test peer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node_modules/typebox
          tgz="$(npm pack typebox@1.3.7 --silent)"
          tar -xzf "$tgz" --strip-components=1 -C node_modules/typebox
          rm -f "$tgz"
          node -e "import('typebox').then(() => console.log('typebox peer ready'))"
      - name: Pi adapter smoke test
        run: node scripts/test-pi-adapter.mjs
      - name: Pi runtime gate regression test
        run: node scripts/test-pi-runtime-gates.mjs
      - name: Release validation
        run: npm run release:check
