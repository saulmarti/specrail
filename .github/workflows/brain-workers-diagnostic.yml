name: Brain Workers diagnostic

on:
  push:
    branches:
      - 'feat/brain-workers'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@v6
      - id: cases
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          out=[]
          for file in ['tests/installer.test.mjs','tests/visualization.test.mjs']:
              text=open(file,encoding='utf-8').read()
              for m in re.finditer(r"\btest\('([^']+)'",text):
                  name=m.group(1)
                  out.append({'file':file,'name':name,'pattern':'^'+re.escape(name)+'$'})
          print('cases='+json.dumps(out,separators=(',',':')))
          PY

  per-test:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.discover.outputs.cases) }}
    name: ${{ matrix.case.file }} :: ${{ matrix.case.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Run one test
        run: node --test --test-force-exit --test-name-pattern="${{ matrix.case.pattern }}" "${{ matrix.case.file }}"
