name: Brain Workers diagnostic

on:
  push:
    branches:
      - 'feat/brain-workers'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Routing baseline
        run: node --test --test-force-exit tests/intelligence-routing.test.mjs
      - name: Worker dirty baseline
        run: node --test --test-force-exit --test-name-pattern="state-only worker ignores unchanged pre-existing dirty production files" tests/worker-runtime.test.mjs
      - name: Worker state-only mutation
        if: always()
        run: node --test --test-force-exit --test-name-pattern="state-only worker fails when it actually mutates production code" tests/worker-runtime.test.mjs
      - name: Worker Builder scope
        if: always()
        run: node --test --test-force-exit --test-name-pattern="Builder worker permits sealed allowed files and blocks outside/protected scope" tests/worker-runtime.test.mjs
      - name: Worker Luna unavailable fallback
        if: always()
        run: node --test --test-force-exit --test-name-pattern="worker falls back Luna to Terra only when Luna is unavailable" tests/worker-runtime.test.mjs
      - name: Worker ordinary failure no promotion
        if: always()
        run: node --test --test-force-exit --test-name-pattern="ordinary Luna failure does not retry Terra or Brain" tests/worker-runtime.test.mjs
      - name: Worker Brain-side validation
        if: always()
        run: node --test --test-force-exit --test-name-pattern="Brain-side loader validates result binding/model attestation and converts usage safely" tests/worker-runtime.test.mjs
