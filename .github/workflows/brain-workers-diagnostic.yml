name: Brain Workers diagnostic

on:
  push:
    branches:
      - 'feat/brain-workers'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@v6
      - id: files
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json
          files=sorted(set(glob.glob('tests/in*.test.mjs')+glob.glob('tests/v*.test.mjs'))-{'tests/installed-e2e.test.mjs'})
          print('files='+json.dumps(files,separators=(',',':')))
          PY

  per-file:
    needs: discover
    if: ${{ needs.discover.outputs.files != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    name: unit ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Run
        run: node --test --test-force-exit "${{ matrix.file }}"
