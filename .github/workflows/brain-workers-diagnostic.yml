name: Brain Workers diagnostic

on:
  push:
    branches:
      - 'feat/brain-workers'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit prefix I
        if: always()
        shell: bash
        run: |
          files=()
          for f in tests/i*.test.mjs; do
            [[ "$f" == "tests/installed-e2e.test.mjs" ]] || files+=("$f")
          done
          node --test --test-force-exit "${files[@]}"
      - name: Unit prefixes J-L
        if: always()
        shell: bash
        run: |
          files=(tests/[j-l]*.test.mjs)
          node --test --test-force-exit "${files[@]}"
      - name: Unit prefixes U-V
        if: always()
        shell: bash
        run: |
          files=(tests/[u-v]*.test.mjs)
          node --test --test-force-exit "${files[@]}"
      - name: Unit prefixes W-Z
        if: always()
        shell: bash
        run: |
          files=(tests/[w-z]*.test.mjs)
          node --test --test-force-exit "${files[@]}"
