name: Brain Workers diagnostic

on:
  push:
    branches:
      - 'feat/brain-workers'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit group A-H
        if: always()
        shell: bash
        run: |
          files=(tests/[a-h]*.test.mjs)
          node --test --test-force-exit "${files[@]}"
      - name: Unit group I-P
        if: always()
        shell: bash
        run: |
          files=()
          for f in tests/[i-p]*.test.mjs; do
            [[ "$f" == "tests/installed-e2e.test.mjs" ]] || files+=("$f")
          done
          node --test --test-force-exit "${files[@]}"
      - name: Unit group Q-Z
        if: always()
        shell: bash
        run: |
          files=(tests/[q-z]*.test.mjs)
          node --test --test-force-exit "${files[@]}"
