name: Brain Workers diagnostic

on:
  push:
    branches:
      - 'feat/brain-workers'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit prefix im
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/im*.test.mjs)
          ((${#files[@]}==0)) || node --test --test-force-exit "${files[@]}"
      - name: Unit prefix in
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/in*.test.mjs)
          for i in "${!files[@]}"; do [[ "${files[$i]}" == "tests/installed-e2e.test.mjs" ]] && unset 'files[i]'; done
          ((${#files[@]}==0)) || node --test --test-force-exit "${files[@]}"
      - name: Unit prefix io-iz
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/i[o-z]*.test.mjs)
          ((${#files[@]}==0)) || node --test --test-force-exit "${files[@]}"
      - name: Unit prefix u
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/u*.test.mjs)
          ((${#files[@]}==0)) || node --test --test-force-exit "${files[@]}"
      - name: Unit prefix v
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/v*.test.mjs)
          ((${#files[@]}==0)) || node --test --test-force-exit "${files[@]}"
